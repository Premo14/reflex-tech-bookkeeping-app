root = "."
tmp_dir = "tmp"

[build]
  # Build the main binary
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  
  # Ignore these directories so air doesn't trigger a rebuild!
  exclude_dir = ["assets", "tmp", "vendor", "documents", ".git"]
  
  # Only watch go files
  include_ext = ["go"]
  
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  send_interrupt = true
  kill_delay = "500ms"

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
